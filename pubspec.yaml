name: cio_news
description: "CIO Africa News mobile app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.0
  cookie_jar: ^4.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  cached_network_image: ^3.3.1
  share_plus: ^9.0.0
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  path_provider: ^2.1.4
  google_sign_in: ^6.2.1
  webview_flutter: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# ── Launcher icon generation ─────────────────────────────────────────────
# Run: dart run flutter_launcher_icons
# Writes Android and iOS app icons from the source images below.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/cio_africa_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/cio_africa_logo.png"
  remove_alpha_ios: true